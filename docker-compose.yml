# Ambiente Conteinerizado de Avaliação de Qualidade — i-Educar 2.12 (ISO/IEC 25040:2024)
# Disciplina: Qualidade de Software 1 (FGA0315) - UnB / FGA
# Issue #10: Planejamento do Ambiente de Testes Conteinerizado (Docker)

services:
  app:
    image: portabilis/i-educar:2.12.0
    container_name: ieducar-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_ENV=testing
      - APP_DEBUG=true
      - APP_KEY=base64:7KqZ4uN2V7R5j3s1Q8t9W2e6Y4u1I3o5P7a9S1d3F5g=
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=ieducar_test
      - DB_USERNAME=ieducar
      - DB_PASSWORD=secret
      - CACHE_DRIVER=redis
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    volumes:
      - ./reports:/var/www/reports

  database:
    image: postgres:18-alpine
    container_name: ieducar-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ieducar_test
      - POSTGRES_USER=ieducar
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ieducar -d ieducar_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: ieducar-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
